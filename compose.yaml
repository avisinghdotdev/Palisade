services:
  web:
    build:
      context: web
      target: serve
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: serve
    env_file: .env
    environment:
      LOG_LEVEL: INFO
      LOG_FORMAT: console
      # The database is shared with the deployed app, which owns migrations and the job worker.
      RUN_MIGRATIONS: "false"
      RUN_WORKER: "false"
