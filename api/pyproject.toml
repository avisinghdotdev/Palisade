[project]
name = "palisade-api"
version = "0.3.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.150.0",
    "httpx2>=2.15.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"
