[project]
name = "palisade-api"
version = "0.9.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.150.0",
    "httpx2>=2.15.1",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"
