[project]
name = "palisade-api"
version = "0.21.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "fastapi>=0.150.0",
    "fpdf2>=2.9.0",
    "http-message-signatures>=2.2.0",
    "httpx2>=2.15.1",
    "mcp>=2.3.0",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sd-jwt>=0.10.4",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "webauthn>=3.0.1",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"
